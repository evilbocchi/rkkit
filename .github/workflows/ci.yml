name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Build and Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: npx prettier --check .
      - run: npx eslint .
      - run: npm run build

      - name: Authenticate Rokit
        shell: bash
        working-directory: ./packages/rkkit
        run: npx rokit authenticate github --token "$GITHUB_TOKEN" --skip-verify

      - name: Run tests
        run: npm run test -- --coverage

      - name: Smoke test CLI
        working-directory: ./packages/rkkit
        run: |
          npx rokit --help
          npx rokit init
          npx rk StyLua src
